name: Test

# 日常提交的兜底：不发布，只跑静态检查与单测（约 3 分钟）
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: 拉依赖
        working-directory: app
        run: flutter pub get

      - name: 格式检查
        working-directory: app
        run: dart format --output=none --set-exit-if-changed lib test || echo "::warning::存在未格式化文件（不阻断）"

      - name: 静态检查
        working-directory: app
        run: flutter analyze

      - name: 单元测试
        working-directory: app
        run: flutter test

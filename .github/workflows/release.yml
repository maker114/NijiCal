name: Release

# 推送 v* 标签即触发：构建 APK → 发 GitHub Release → 回写 updates/latest.json
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 读取版本号（来自 pubspec.yaml）
        id: ver
        run: |
          VERSION=$(grep -E '^version:' app/pubspec.yaml | awk '{print $2}')
          NAME=${VERSION%%+*}
          CODE=${VERSION##*+}
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "版本：$NAME ($CODE)"

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      # 关键：沿用历史版本的同一把签名钥匙，否则应用内「覆盖安装」会被系统拒绝。
      # 显式写 key.properties（build.gradle.kts 会优先读它），
      # 不再依赖 ~/.android/debug.keystore——runner 上的 ANDROID_SDK_HOME 会让 AGP 用另一份。
      - name: 恢复签名（key.properties）
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::缺少仓库 secret ANDROID_DEBUG_KEYSTORE_BASE64，无法签名；见 README「发布流程」。"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > app/android/app/debug-keystore.jks
          cat > app/android/key.properties <<EOF
          storeFile=debug-keystore.jks
          storePassword=android
          keyAlias=androiddebugkey
          keyPassword=android
          EOF
          echo "keystore 就绪：$(ls -l app/android/app/debug-keystore.jks | awk '{print $5}') 字节"

      - name: 打印工具链版本
        working-directory: app
        run: |
          flutter --version
          dart --version

      - name: 拉依赖
        working-directory: app
        run: flutter pub get

      - name: 静态检查
        working-directory: app
        run: flutter analyze

      - name: 单元测试
        working-directory: app
        run: |
          set -o pipefail
          flutter test 2>&1 | tee ../ci-test.log

      # 失败时把日志推到 ci-logs 分支，方便维护者（本机读不到 Actions 日志时）排查
      - name: 失败时上传日志
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-logs
          git add -f ci-test.log || true
          git commit -m "ci: 失败日志 $(date -u +%FT%TZ)" || true
          git push -f origin ci-logs || true

      - name: 构建 APK
        working-directory: app
        run: |
          flutter build apk --release \
            --build-name=${{ steps.ver.outputs.name }} \
            --build-number=${{ steps.ver.outputs.code }}
          cp build/app/outputs/flutter-apk/app-release.apk \
             "../NijiCal-${{ steps.ver.outputs.name }}.apk"

      - name: 校验签名与版本
        run: |
          APK="NijiCal-${{ steps.ver.outputs.name }}.apk"
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/aapt2" dump badging "$APK" | grep -E "^package:"

          # 签名证书必须是历史版本那一把，否则用户覆盖安装会被系统拒绝
          EXPECTED="c58abe87b11d39bd258fc79d7550080f120dc7c064615f96366c949073165e32"
          GOT=$("$BT/apksigner" verify --print-certs "$APK" | grep -oE 'SHA-256 digest: [0-9a-f]+' | head -1 | awk '{print $3}')
          echo "签名证书 SHA-256: $GOT"
          if [ "$GOT" != "$EXPECTED" ]; then
            echo "::error::签名证书与历史版本不一致（期望 $EXPECTED，实际 $GOT）。请检查 secret ANDROID_DEBUG_KEYSTORE_BASE64。"
            exit 1
          fi

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          name: "NijiCal ${{ steps.ver.outputs.name }}"
          tag_name: ${{ github.ref_name }}
          files: NijiCal-${{ steps.ver.outputs.name }}.apk
          generate_release_notes: false
          body: |
            版本 ${{ steps.ver.outputs.name }}（${{ steps.ver.outputs.code }}）

            应用内「订阅 → 检查更新」可直接下载覆盖安装，数据不丢。
          fail_on_unmatched_files: true
          overwrite_files: true

      - name: 回写 updates/latest.json
        run: |
          cat > updates/latest.json <<EOF
          {
            "version": "${{ steps.ver.outputs.name }}",
            "versionCode": ${{ steps.ver.outputs.code }},
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/NijiCal-${{ steps.ver.outputs.name }}.apk",
            "publishedAt": "$(date -u +%Y-%m-%d)",
            "notes": "$(git log -1 --pretty=%s | sed 's/"/\\"/g')"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/latest.json
          git commit -m "chore(release): 更新清单 ${{ steps.ver.outputs.name }} (${{ steps.ver.outputs.code }}) [skip ci]" || echo "清单无变化"
          git push origin HEAD:main

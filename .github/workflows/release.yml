name: Release

# 推送 v* 标签即触发：构建 APK → 发 GitHub Release → 回写 updates/latest.json
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 读取版本号（来自 pubspec.yaml）
        id: ver
        run: |
          VERSION=$(grep -E '^version:' app/pubspec.yaml | awk '{print $2}')
          NAME=${VERSION%%+*}
          CODE=${VERSION##*+}
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "版本：$NAME ($CODE)"

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 关键：沿用本机 debug keystore 的同一份签名，
      # 否则应用内「覆盖安装」会因签名不一致被系统拒绝。
      - name: 恢复签名（debug keystore）
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::缺少仓库 secret ANDROID_DEBUG_KEYSTORE_BASE64，无法签名；见 README「发布流程」。"
            exit 1
          fi
          mkdir -p "$HOME/.android"
          echo "$KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"

      - name: 依赖与测试
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: 构建 APK
        working-directory: app
        run: |
          flutter build apk --release \
            --build-name=${{ steps.ver.outputs.name }} \
            --build-number=${{ steps.ver.outputs.code }}
          cp build/app/outputs/flutter-apk/app-release.apk \
             "../NijiCal-${{ steps.ver.outputs.name }}.apk"

      - name: 校验签名与版本
        run: |
          APK="NijiCal-${{ steps.ver.outputs.name }}.apk"
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/aapt2" dump badging "$APK" | grep -E "^package:"

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          name: "NijiCal ${{ steps.ver.outputs.name }}"
          tag_name: ${{ github.ref_name }}
          files: NijiCal-${{ steps.ver.outputs.name }}.apk
          generate_release_notes: false
          body: |
            版本 ${{ steps.ver.outputs.name }}（${{ steps.ver.outputs.code }}）

            应用内「订阅 → 检查更新」可直接下载覆盖安装，数据不丢。
          fail_on_unmatched_files: true

      - name: 回写 updates/latest.json
        run: |
          cat > updates/latest.json <<EOF
          {
            "version": "${{ steps.ver.outputs.name }}",
            "versionCode": ${{ steps.ver.outputs.code }},
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/NijiCal-${{ steps.ver.outputs.name }}.apk",
            "publishedAt": "$(date -u +%Y-%m-%d)",
            "notes": "$(git log -1 --pretty=%s | sed 's/"/\\"/g')"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/latest.json
          git commit -m "chore(release): 更新清单 ${{ steps.ver.outputs.name }} (${{ steps.ver.outputs.code }}) [skip ci]" || echo "清单无变化"
          git push origin HEAD:main
